<!DOCTYPE html>
<html>
<head>
<title>Calculator - Rinku</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{ background:#0a192f; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; min-height:100vh; flex-direction:column; }
h1{ color:#00e5ff; }
.cal{ background:#112240; padding:20px; border-radius:20px; box-shadow:0 0 20px #00e5ff50; width:300px; }
#display{ width:100%; height:50px; background:#0a192f; border:2px solid #00e5ff; border-radius:10px; color:white; font-size:24px; text-align:right; padding:10px; box-sizing:border-box; margin-bottom:15px; }
.btns{ display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
button{ padding:18px; font-size:18px; font-weight:bold; border:none; border-radius:10px; cursor:pointer; background:#1d3557; color:white; }
button:hover{ background:#00e5ff; color:black; }
.op{ background:#ff6b35; }
.eq{ background:#00e5ff; color:black; grid-column:span 2; }
.cl{ background:#ff3333; }
.back{ margin-top:20px; color:#00e5ff; text-decoration:none; border:1px solid #00e5ff; padding:8px 15px; border-radius:8px; }
</style>
</head>
<body>
<h1>My Calculator</h1>
<div class="cal">
<input type="text" id="display" disabled>
<div class="btns">
<button class="cl" onclick="display.value=''">C</button>
<button onclick="display.value=display.value.slice(0,-1)">⌫</button>
<button onclick="display.value+='%'">%</button>
<button class="op" onclick="display.value+='/'">/</button>
<button onclick="display.value+='7'">7</button>
<button onclick="display.value+='8'">8</button>
<button onclick="display.value+='9'">9</button>
<button class="op" onclick="display.value+='*'">x</button>
<button onclick="display.value+='4'">4</button>
<button onclick="display.value+='5'">5</button>
<button onclick="display.value+='6'">6</button>
<button class="op" onclick="display.value+='-'">-</button>
<button onclick="display.value+='1'">1</button>
<button onclick="display.value+='2'">2</button>
<button onclick="display.value+='3'">3</button>
<button class="op" onclick="display.value+='+'">+</button>
<button onclick="display.value+='0'">0</button>
<button onclick="display.value+='.'">.</button>
<button class="eq" onclick="try{display.value=eval(display.value)}catch{display.value='Error'}">=</button>
</div>
</div>
<a href="./index.html" class="back">Back to Portfolio</a>
</body>
</html>
